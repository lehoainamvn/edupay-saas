server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Hỗ trợ HTML5 PushState / Angular Router (chống 404 khi F5 hoặc mở URL trực tiếp)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chống cache index.html để client luôn nhận bản build mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache tĩnh cho JS, CSS, Font, Ảnh
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

