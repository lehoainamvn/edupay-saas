version: '3.8'

# ─── DEV Docker Compose ──────────────────────────────────────────────────────
# Chạy lệnh: docker compose -f docker/docker-compose.dev.yml up -d
# Chỉ chạy PostgreSQL local. Backend và Frontend chạy trực tiếp bằng IDE/CLI.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: edupay_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: edupay_dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edupay_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin (Giao diện quản lý DB trực quan trên trình duyệt)
  # Truy cập: http://localhost:5050
  # Login: admin@edupay.dev / admin123
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edupay_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edupay.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres-dev:
        condition: service_healthy

volumes:
  postgres_dev_data:
  pgadmin_data:
