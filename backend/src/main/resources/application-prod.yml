# ╔══════════════════════════════════════════════════════════════════╗
# ║  application-prod.yml — Môi trường PRODUCTION                   ║
# ║  Áp dụng khi: SPRING_PROFILES_ACTIVE=prod                       ║
# ║  TẤT CẢ giá trị nhạy cảm đọc từ BIẾN MÔI TRƯỜNG (ENV VARS)    ║
# ║  KHÔNG BAO GIỜ hardcode password/secret vào file này!           ║
# ╚══════════════════════════════════════════════════════════════════╝

spring:
  # ─── Database: PostgreSQL PRODUCTION ─────────────────────────────
  # Giá trị đọc hoàn toàn từ biến môi trường của server/cloud
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Connection Pool tối ưu cho Production
    hikari:
      pool-name: EduPay-PROD-Pool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000  # Cảnh báo nếu connection bị giữ > 60s

  jpa:
    hibernate:
      ddl-auto: validate               # Tuyệt đối không dùng create/update trên prod!
    show-sql: false                    # Tắt log SQL trên production (bảo mật)

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Chỉ cho phép migration mới, không sửa migration đã chạy
    validate-on-migrate: true

# ─── Logging: Tối giản, chỉ log lỗi quan trọng ───────────────────
logging:
  level:
    root: WARN
    com.edupay: INFO             # Log nghiệp vụ ở mức INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF       # Tắt hoàn toàn SQL log trên prod
  file:
    name: /var/log/edupay/app.log
    max-size: 50MB
    max-history: 30

# ─── CORS: Chỉ domain thật của sản phẩm ──────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}        # Đọc từ biến môi trường server
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}  # VD: https://edupay.vn,https://www.edupay.vn
